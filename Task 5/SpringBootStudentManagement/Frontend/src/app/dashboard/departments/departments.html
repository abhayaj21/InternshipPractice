<div class="page-wrapper animate-fade-up">

  <!-- Page Header -->
  <div class="page-header">
    <div class="page-header-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
    </div>
    <div>
      <h2 class="page-title">Departments</h2>
      <p class="page-sub">Add and manage your institution's departments</p>
    </div>
  </div>

  <div class="dept-layout">

    <!-- Add Department Panel -->
    <div class="add-dept-card">
      <h3 class="card-section-title">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        New Department
      </h3>
      <form>
        <div class="field-wrap">
          <label for="departmentName" class="form-label">Department Name</label>
          <input
            type="text"
            id="departmentName"
            name="departmentName"
            class="form-control text-uppercase mb-3"
            placeholder="e.g. COMPUTER SCIENCE"
            required
            [(ngModel)]="departmentName"
          />
        </div>
        <button type="submit" class="btn btn-primary add-btn" [disabled]="departmentName === ''" (click)="addDepartment()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          Add Department
        </button>
      </form>
    </div>

    <!-- Departments Table -->
    <div class="table-card">
      <div class="table-responsive">
        <table class="data-table">
          <thead>
            <tr>
              <th>#</th>
              <th>ID</th>
              <th>Department Name</th>
              <th class="col-actions">Actions</th>
            </tr>
          </thead>
          <tbody>

            <!-- No Data -->
            <tr class="empty-row" *ngIf="this.departmentsData.length === 0 && isServerRespond">
              <td colspan="4">
                <div class="empty-state">
                  <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                    <polyline points="9 22 9 12 15 12 15 22"/>
                  </svg>
                  <span>No departments found. Add one to get started.</span>
                </div>
              </td>
            </tr>

            <!-- Server Error -->
            <tr class="error-row" *ngIf="!isServerRespond">
              <td colspan="4">
                <div class="server-error-state">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
                  </svg>
                  Server not responding. Please try again later.
                </div>
              </td>
            </tr>

            <!-- Normal Data -->
            <ng-container *ngIf="this.departmentsData.length !== 0 && isServerRespond">
              <tr *ngFor="let dept of departmentsData; let i = index" class="data-row">
                <td><span class="row-num">{{ i + 1 }}</span></td>
                <td><span class="id-badge">{{ dept.departmentId }}</span></td>
                <td><span class="dept-name">{{ dept.departmentName }}</span></td>
                <td class="col-actions">
                  <div class="action-btns">
                    <button class="act-btn act-edit" data-bs-toggle="modal" data-bs-target="#updateDeptModal" (click)="openUpdateDepartmentModal(i, dept.departmentId)" title="Edit">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                      </svg>
                    </button>
                    <button class="act-btn act-delete" (click)="deleteDepartment(dept.departmentId, i)" title="Delete">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <polyline points="3 6 5 6 21 6"/>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
                      </svg>
                    </button>
                  </div>
                </td>
              </tr>
            </ng-container>

          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- ── Update Department Modal ── -->
<div class="modal fade" id="updateDeptModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="margin-right:8px">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
          </svg>
          Update Department
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" #closebtn></button>
      </div>
      <div class="modal-body">
        <form>
          <div class="form-group">
            <label class="form-label">Department Name</label>
            <input type="hidden" name="departmentId" id="departmentId" [(ngModel)]="departmentId">
            <input
              type="text"
              id="updateDeptName"
              name="departmentName"
              class="form-control text-uppercase"
              placeholder="Enter department name"
              required
              [(ngModel)]="this.updatedDepartmentName"
            />
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-primary" type="submit" [disabled]="updatedDepartmentName === ''" (click)="updateDepartment()">Save Changes</button>
      </div>
    </div>
  </div>
</div>
