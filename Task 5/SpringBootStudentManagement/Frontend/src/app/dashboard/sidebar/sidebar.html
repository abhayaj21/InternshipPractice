<aside class="sidebar position-sticky top-0" [class.mobile-open]="sidebarState.isOpen()">
  <div class="sidebar-header">
    <div class="sidebar-logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/>
      </svg>
    </div>
    <div class="sidebar-brand">
      <span class="brand-title">EduManage</span>
      <span class="brand-sub">Admin Portal</span>
    </div>
    <!-- Mobile close button -->
    <button class="sidebar-close-btn" (click)="sidebarState.close()" aria-label="Close menu">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>

  <div class="sidebar-section-label">Main Menu</div>

  <nav (click)="checkUrl()">
    <ul class="nav-list">
      <li routerLinkActive="nav-active" [routerLinkActiveOptions]="{ exact: true }">
        <a routerLink="/dashboard" class="nav-item">
          <span class="nav-icon">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
              <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
            </svg>
          </span>
          <span class="nav-label">Dashboard</span>
        </a>
      </li>

      <li class="has-sub" routerLinkActive="parentActive">
        <a href="javascript:void(0)" class="nav-item">
          <span class="nav-icon">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
          </span>
          <span class="nav-label">Students</span>
          <span class="nav-arrow">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </span>
        </a>
        <ul class="sub-list" [class.sub-open]="isStudent">
          <li routerLinkActive="nav-active">
            <a routerLink="/dashboard/student/add" class="sub-item">
              <span class="sub-dot"></span>Add Student
            </a>
          </li>
          <li routerLinkActive="nav-active">
            <a routerLink="/dashboard/student/list" class="sub-item">
              <span class="sub-dot"></span>View Students
            </a>
          </li>
        </ul>
      </li>

      <li routerLinkActive="nav-active">
        <a routerLink="/dashboard/departments" class="nav-item">
          <span class="nav-icon">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
              <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
          </span>
          <span class="nav-label">Departments</span>
        </a>
      </li>
    </ul>
  </nav>

  <div class="sidebar-spacer"></div>

  <div class="sidebar-section-label">Account</div>
  <ul class="nav-list nav-bottom">
    <li>
      <a (click)="onLogout()" class="nav-item nav-logout" style="cursor:pointer">
        <span class="nav-icon">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </span>
        <span class="nav-label">Logout</span>
      </a>
    </li>
  </ul>
</aside>
