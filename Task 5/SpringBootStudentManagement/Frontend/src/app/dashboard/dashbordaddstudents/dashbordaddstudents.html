<div class="page-wrapper animate-fade-up">

  <!-- Page Header -->
  <div class="page-header">
    <div class="page-header-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
        <circle cx="8.5" cy="7" r="4"/>
        <line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/>
      </svg>
    </div>
    <div>
      <h2 class="page-title">Add New Student</h2>
      <p class="page-sub">Fill in the student information below</p>
    </div>
  </div>

  <!-- Form Card -->
  <div class="form-card">
    <form [formGroup]="studentForm" (ngSubmit)="saveStudent()">
      <div class="form-grid">

        <!-- Roll No -->
        <div class="field-wrap">
          <label for="rollNo" class="form-label">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <rect x="9" y="9" width="13" height="13" rx="2"/>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
            Roll No
          </label>
          <input type="number" id="rollNo" class="form-control" placeholder="e.g. S001" formControlName="rollNo"/>
        </div>

        <!-- Full Name -->
        <div class="field-wrap">
          <label for="name" class="form-label">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            Full Name
          </label>
          <input type="text" id="name" class="form-control" placeholder="Enter student's full name" formControlName="studentName"/>
        </div>

        <!-- Email -->
        <div class="field-wrap">
          <label for="email" class="form-label">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
              <polyline points="22,6 12,13 2,6"/>
            </svg>
            Email Address
          </label>
          <input type="email" id="email" class="form-control" placeholder="student@university.edu" formControlName="email"/>
        </div>

        <!-- Marks -->
        <div class="field-wrap">
          <label for="marks" class="form-label">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
            </svg>
            Marks / Score
          </label>
          <input type="number" id="marks" class="form-control" placeholder="e.g. 85" formControlName="marks"/>
        </div>

        <!-- City -->
        <div class="field-wrap">
          <label for="city" class="form-label">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
              <circle cx="12" cy="10" r="3"/>
            </svg>
            City
          </label>
          <input type="text" id="city" class="form-control" placeholder="Enter city name" formControlName="city"/>
        </div>

        <!-- Department -->
        <div class="field-wrap">
          <label for="department" class="form-label">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
              <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
            Department
          </label>
          <select id="department" class="form-select" formControlName="deptId">
            <option value="" disabled selected>Select a department</option>
            <option *ngFor="let dept of this.departments" [value]="dept.departmentId">{{ dept.departmentName }}</option>
          </select>
        </div>

      </div><!-- /form-grid -->

      <!-- Submit -->
      <div class="form-actions">
        <button type="submit" class="btn btn-primary submit-btn" [disabled]="studentForm.invalid">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
            <polyline points="17 21 17 13 7 13 7 21"/>
            <polyline points="7 3 7 8 15 8"/>
          </svg>
          Save Student
        </button>
      </div>
    </form>
  </div>
</div>
