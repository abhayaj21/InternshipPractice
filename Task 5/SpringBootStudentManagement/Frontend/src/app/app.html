<!-- LOGIN -->
<div class="auth-screen" *ngIf="!showRegister && !getLoginStatus()">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
  <div class="auth-card animate-fade-up">
    <div class="auth-brand">
      <div class="brand-icon">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/>
        </svg>
      </div>
      <span class="brand-name">EduManage</span>
    </div>
    <div class="auth-header">
      <h2>Welcome back</h2>
      <p>Sign in to your admin account</p>
    </div>
    <form [formGroup]="loginForm" (ngSubmit)="onLogin()" class="auth-form">
      <div class="field-group">
        <label class="form-label">Email address</label>
        <div class="input-wrap">
          <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
          <input type="text" class="form-control" placeholder="Enter your email" formControlName="email"/>
        </div>
      </div>
      <div class="field-group">
        <label class="form-label">Password</label>
        <div class="input-wrap">
          <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input type="password" class="form-control" placeholder="Enter your password" formControlName="password"/>
        </div>
      </div>
      <button type="submit" class="btn btn-primary w-100 auth-btn" [disabled]="loginForm.invalid">
        Sign In <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>
      <p class="auth-switch">Don't have an account? <a class="auth-link" (click)="toggleForm()" style="cursor:pointer">Create account</a></p>
    </form>
  </div>
</div>

<!-- REGISTER -->
<div class="auth-screen" *ngIf="showRegister && !getLoginStatus()">
  <div class="blob blob-1"></div><div class="blob blob-2"></div><div class="blob blob-3"></div>
  <div class="auth-card animate-fade-up">
    <div class="auth-brand">
      <div class="brand-icon">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/>
        </svg>
      </div>
      <span class="brand-name">EduManage</span>
    </div>
    <div class="auth-header"><h2>Create account</h2><p>Set up your admin profile</p></div>
    <form [formGroup]="registerForm" (ngSubmit)="onRegister()" class="auth-form">
      <div class="field-group">
        <label class="form-label">Username</label>
        <div class="input-wrap">
          <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
          </svg>
          <input type="text" class="form-control" placeholder="Choose a username" formControlName="userName"/>
        </div>
      </div>
      <div class="field-group">
        <label class="form-label">Email address</label>
        <div class="input-wrap">
          <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
          <input type="email" class="form-control" placeholder="Enter your email" formControlName="email"/>
        </div>
      </div>
      <div class="field-row">
        <div class="field-group">
          <label class="form-label">Password</label>
          <div class="input-wrap">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input type="password" class="form-control" placeholder="Password" formControlName="password"/>
          </div>
        </div>
        <div class="field-group">
          <label class="form-label">Confirm</label>
          <div class="input-wrap">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            <input type="password" class="form-control" placeholder="Confirm" formControlName="confirmPassword"/>
          </div>
        </div>
      </div>
      <button type="submit" class="btn btn-primary w-100 auth-btn" [disabled]="registerForm.invalid">
        Create Account <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>
      <p class="auth-switch">Already have an account? <a class="auth-link" (click)="toggleForm()" style="cursor:pointer">Sign in</a></p>
    </form>
  </div>
</div>

<!-- DASHBOARD -->
<div *ngIf="getLoginStatus()">
  <router-outlet></router-outlet>
</div>

<!-- GLOBAL: Toast & Confirm Dialog (always mounted) -->
<app-toast></app-toast>
<app-confirm-dialog></app-confirm-dialog>
